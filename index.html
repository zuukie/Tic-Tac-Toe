<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/9539ec0894.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <main>
      <div class="mainColumn">
        <h1>Tic-Tac-Toe</h1>
        <h3 id="whosTurn"></h3>
        <div class="game">
          <hr id="line" style="visibility: hidden" />
          <div id="LT00" class="box">
            <i></i>
          </div>
          <div id="CT01" class="box">
            <i></i>
          </div>
          <div id="RT02" class="box">
            <i></i>
          </div>
          <div id="LC10" class="box">
            <i></i>
          </div>
          <div id="CC11" class="box">
            <i></i>
          </div>
          <div id="RC12" class="box">
            <i></i>
          </div>
          <div id="LB20" class="box">
            <i></i>
          </div>
          <div id="CB21" class="box">
            <i></i>
          </div>
          <div id="RB22" class="box">
            <i></i>
          </div>
        </div>
        <div class="buttons">
          <button id="newGameBtn">Start Game</button>
          <button id="endGameBtn">End Game</button>
        </div>
      </div>
      <div class="extras">
        <div class="stats">
          <h4>Game Stats</h4>
          <div class="stat">
            <div class="crosses">
              <p id="crossesWinsNum">0</p>
              <i class="fa-solid fa-x"></i>
            </div>
            <div class="draws">
              <p id="drawsNum">0</p>
              <p class="drawsDesc">Draws</p>
            </div>
            <div class="circles">
              <p id="circlesWinsNum">0</p>
              <i class="fa-regular fa-circle"></i>
            </div>
          </div>
        </div>
        <div class="settings" id="settingsMenu">
          <h4>Settings</h4>
          <p class="info">(end game to edit)</p>
          <div class="setting">
            <h5>Game Type</h5>
            <div class="options mini">
              <div class="enabled" id="players">
                <i class="fa-solid fa-user-group"></i>
                <p>2 Players</p>
              </div>
              <div id="computer">
                <i class="fa-solid fa-computer"></i>
                <p>Computer</p>
              </div>
            </div>
            <div id="settings2Players">
              <div class="setting">
                <h5>Who starts?</h5>
                <div class="options">
                  <div id="firstCross" class="">
                    <i class="fa-solid fa-x"></i>
                    <p>Cross</p>
                  </div>
                  <div id="firstCircle" class="">
                    <i class="fa-regular fa-circle"></i>
                    <p>Circle</p>
                  </div>
                  <div id="rotation" class="enabled">
                    <i class="fa-solid fa-random"></i>
                    <p>Rotation</p>
                  </div>
                </div>
              </div>
            </div>
            <div id="settingsComputer" style="display: none">
              <div class="setting">
                <h5>Player Sign</h5>
                <div class="options mini">
                  <div id="playerCross" class="enabled">
                    <i class="fa-solid fa-x"></i>
                    <p>Cross</p>
                  </div>
                  <div id="playerCircle" class="">
                    <i class="fa-regular fa-circle"></i>
                    <p>Circle</p>
                  </div>
                </div>
              </div>

              <div class="setting">
                <h5>Who starts?</h5>
                <div class="options">
                  <div id="firstPlayer" class="">
                    <i class="fa-solid fa-user"></i>
                    <p>Player</p>
                  </div>
                  <div id="firstComputer" class="">
                    <i class="fa-solid fa-computer"></i>
                    <p>Computer</p>
                  </div>
                  <div id="rotationPc" class="enabled">
                    <i class="fa-solid fa-random"></i>
                    <p>Rotation</p>
                  </div>
                </div>
              </div>
              <div class="setting">
                <h5>Difficulty</h5>
                <div class="options mini">
                  <div id="easy" class="enabled">
                    <i class="fa-solid fa-lemon"></i>
                    <p>Easy</p>
                  </div>
                  <div id="medium" class="">
                    <i class="fa-solid fa-star"></i>
                    <p>Normal</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script src="./script.js"></script>
</html>
